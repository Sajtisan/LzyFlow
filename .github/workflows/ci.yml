name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LzyFlow.slnx

      - name: Verify formatting
        run: dotnet format LzyFlow.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build LzyFlow.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test LzyFlow.slnx
          --configuration Release
          --no-build
          --no-restore